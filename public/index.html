<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- Sayt kattalashtirilmaydi: na barmoq bilan (pinch), na input bosilganda -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, shrink-to-fit=no"
    />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <style id="sporton-inputs">
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        /* ikki marta bosib kattalashtirishni o'chiradi */
        touch-action: manipulation;
      }
      * {
        -webkit-tap-highlight-color: transparent;
      }
      /* Fokusda hech qanday effekt yo'q: chegara, soya, halqa */
      input,
      textarea,
      select,
      [contenteditable],
      input:focus,
      textarea:focus,
      select:focus,
      input:focus-visible,
      textarea:focus-visible,
      [contenteditable]:focus {
        outline: none !important;
        box-shadow: none !important;
        -webkit-appearance: none;
        appearance: none;
      }
      /* iOS Safari 16px dan kichik shriftli inputga fokus bo'lganda sahifani kattalashtiradi */
      @media (hover: none) and (pointer: coarse) {
        input,
        textarea,
        select {
          font-size: 16px !important;
        }
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
  </body>
</html>
